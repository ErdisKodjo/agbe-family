# ============================================================
# AGBE Family — Nginx reverse proxy de production
# À installer : /etc/nginx/sites-available/agbe-family
#   sudo ln -s /etc/nginx/sites-available/agbe-family /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS : remplacer agbe.family par votre domaine, puis
#   sudo certbot --nginx -d agbe.family
# (certbot réécrit les blocs 80/443 avec les certificats Let's Encrypt)
# ============================================================

upstream agbe_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limit connexions (protection brute-force, 5 req/s par IP)
limit_req_zone $binary_remote_addr zone=agbe_login:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name agbe.family;          # ← votre domaine

    # Redirige tout vers HTTPS une fois le certificat en place
    # (certbot gère cette section automatiquement)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agbe.family;          # ← votre domaine

    # Certificats Let's Encrypt (créés par certbot)
    ssl_certificate     /etc/letsencrypt/live/agbe.family/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agbe.family/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Journal d'audit applicatif
    access_log /var/log/nginx/agbe-family.access.log;
    error_log  /var/log/nginx/agbe-family.error.log warn;

    # Les preuves de paiement peuvent atteindre 8 Mo
    client_max_body_size 12m;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Cache long pour les assets statiques Next.js (fingerprintés)
    location /_next/static/ {
        proxy_pass http://agbe_app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Statiques publics (logos, icônes PWA, manifest)
    location ~* ^/(logo-|icon-|apple-|manifest|favicon) {
        proxy_pass http://agbe_app;
        add_header Cache-Control "public, max-age=604800";
    }

    # Connexion : limitation de débit
    location = /api/auth/login {
        limit_req zone=agbe_login burst=10 nodelay;
        proxy_pass http://agbe_app;
        include /etc/nginx/proxy_params;
    }

    # Tout le reste → application
    location / {
        proxy_pass http://agbe_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
